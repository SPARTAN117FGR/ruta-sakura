<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruta Sakura</title>
  <style>
    body {
      margin: 0;
      background: #16111a;
      color: #fff;
      font: 16px system-ui, sans-serif;
      text-align: center;
    }

    main { padding: 16px; }

    canvas {
      display: block;
      width: min(100%, 420px);
      height: auto;
      margin: 12px auto;
      background: #292030;
      border-radius: 12px;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #ffd4e3;
      color: #261321;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Ruta Sakura</h1>
    <button id="exportar" disabled>Descargar video</button>
    <p id="estado" role="status">Cargando la foto…</p>
    <canvas width="1080" height="1920"
      aria-label="Auto en una carretera de cerezos"></canvas>
  </main>

  <script>
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const boton = document.querySelector("#exportar");
    const estado = document.querySelector("#estado");
    const foto = new Image();
    const ancho = 1150;
    const alto = 2048;
    const duracion = 6;
    const vuelta = 2 * Math.PI;
    let inicio;

    const petalos = Array.from({ length: 42 }, (_, i) => ({
      x: Math.random() * (ancho + 120),
      fase: Math.random(),
      tamano: 2 + Math.random() * 7,
      angulo: Math.random() * vuelta,
      vueltas: 1 + i % 3,
      opacidad: .3 + Math.random() * .46
    }));

    function brillo(x, y, radioX, radioY, color, intensidad) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(radioX, radioY);

      const luz = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      luz.addColorStop(0, `rgba(${color},${intensidad})`);
      luz.addColorStop(1, `rgba(${color},0)`);

      ctx.fillStyle = luz;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
    }

    function rueda(x, y, radioX, radioY, inclinacion, giro) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(inclinacion);
      ctx.scale(radioX, radioY);
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, vuelta);
      ctx.clip();

      ctx.fillStyle = "rgba(5,7,12,.44)";
      ctx.fillRect(-1, -1, 2, 2);
      ctx.rotate(giro);
      ctx.strokeStyle = "rgba(192,203,221,.44)";
      ctx.lineWidth = .075;

      for (let i = 0; i < 6; i++) {
        ctx.rotate(vuelta / 6);
        ctx.beginPath();
        ctx.moveTo(.19, 0);
        ctx.quadraticCurveTo(.52, .16, .91, 0);
        ctx.stroke();
      }

      ctx.fillStyle = "#353942";
      ctx.beginPath();
      ctx.arc(0, 0, .18, 0, vuelta);
      ctx.fill();
      ctx.restore();
    }

    function limpiaparabrisas(x, y, largo, angulo) {
      const puntaX = x + Math.cos(angulo) * largo;
      const puntaY = y + Math.sin(angulo) * largo;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#11151b";

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(puntaX, puntaY);
      ctx.stroke();

      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(x + (puntaX - x) * .47, y + (puntaY - y) * .47);
      ctx.lineTo(puntaX, puntaY);
      ctx.stroke();
    }

    function dibujar(tiempo) {
      const fase = tiempo / duracion;
      ctx.setTransform(canvas.width / ancho, 0, 0, canvas.height / alto, 0, 0);
      ctx.drawImage(foto, 0, 0, ancho, alto);

      // Los radios de las dos ruedas visibles giran en perspectiva.
      rueda(847, 1124, 12, 47, -.12, -fase * vuelta * 16);
      rueda(933, 1070, 6, 33, -.10, -fase * vuelta * 16);

      // Limita el barrido de los limpiaparabrisas al vidrio.
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(550, 1040);
      ctx.lineTo(610, 976);
      ctx.lineTo(795, 956);
      ctx.lineTo(824, 1021);
      ctx.closePath();
      ctx.clip();

      const avance = Math.min(1, Math.max(0, (tiempo - 1.6) / 1.15));
      const barrido = Math.sin(avance * Math.PI) ** 2;
      limpiaparabrisas(694, 1036, 107, -2.97 + barrido * 1.68);
      limpiaparabrisas(790, 1027, 102, -2.96 + barrido * 1.55);
      ctx.restore();

      // Los faros dan un pulso suave y el reflejo rosa cruza el cofre.
      ctx.globalCompositeOperation = "screen";
      const intensidad = .10 + .32 * Math.exp(-(((tiempo - 3.8) / .48) ** 2));
      brillo(487, 1088, 30, 19, "220,237,255", intensidad);
      brillo(764, 1066, 37, 19, "220,237,255", intensidad);
      brillo(568 + Math.sin(fase * vuelta) * 125, 1079, 84, 13, "255,165,199", .15);
      ctx.globalCompositeOperation = "source-over";

      for (const petalo of petalos) {
        const recorrido = (petalo.fase + fase * petalo.vueltas) % 1;
        const x = petalo.x - 60 - recorrido * 190
          + 24 * Math.sin(vuelta * recorrido + petalo.angulo);
        const y = recorrido * (alto + 100) - 50;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(petalo.angulo + recorrido * vuelta * 2);
        ctx.fillStyle = `rgba(255,183,213,${petalo.opacidad})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, petalo.tamano, petalo.tamano * .42, 0, 0, vuelta);
        ctx.fill();
        ctx.restore();
      }
    }

    function animar(ahora) {
      inicio ??= ahora;
      dibujar((Math.max(0, ahora - inicio) / 1000) % duracion);
      requestAnimationFrame(animar);
    }

    boton.onclick = async () => {
      if (!window.MediaRecorder || !canvas.captureStream) {
        estado.textContent = "Abre la página en Chrome o Edge desde tu PC.";
        return;
      }

      boton.disabled = true;
      let flujo;

      try {
        const formatos = [
          "video/mp4;codecs=avc1.420033",
          "video/mp4",
          "video/webm;codecs=vp9",
          "video/webm"
        ];
        const formato = formatos.find(tipo => MediaRecorder.isTypeSupported(tipo));

        flujo = canvas.captureStream(30);
        const grabador = new MediaRecorder(flujo, formato
          ? { mimeType: formato, videoBitsPerSecond: 8500000 }
          : { videoBitsPerSecond: 8500000 });

        const terminado = new Promise((resolver, rechazar) => {
          const partes = [];
          grabador.ondataavailable = evento => {
            if (evento.data.size) partes.push(evento.data);
          };
          grabador.onstop = () => resolver(new Blob(partes, { type: grabador.mimeType }));
          grabador.onerror = () => rechazar(new Error("Error al grabar"));
        });

        estado.textContent = "Grabando 6 segundos. Mantén esta pestaña visible.";
        inicio = performance.now();
        dibujar(0);
        grabador.start();

        setTimeout(() => {
          if (grabador.state === "recording") grabador.stop();
        }, duracion * 1000);

        const video = await terminado;
        if (!video.size) throw new Error("Video vacío");

        const extension = video.type.includes("mp4") ? "mp4" : "webm";
        const url = URL.createObjectURL(video);
        const enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = `Ruta-Sakura.${extension}`;
        enlace.click();

        setTimeout(() => URL.revokeObjectURL(url), 30000);
        estado.textContent = `Video descargado en formato ${extension.toUpperCase()}.`;
      } catch {
        estado.textContent = "No se pudo exportar. Prueba en Chrome o Edge actualizado.";
      } finally {
        flujo?.getTracks().forEach(pista => pista.stop());
        boton.disabled = false;
      }
    };

    foto.onload = () => {
      estado.textContent = "Vista previa lista.";
      boton.disabled = false;
      requestAnimationFrame(animar);
    };

    foto.onerror = () => {
      estado.textContent = "Sube 1795447316340.jpg al mismo lugar que index.html.";
    };

    foto.src = "./1795447316340.jpg";
  </script>
</body>
</html>
